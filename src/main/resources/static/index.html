<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Mini App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            color: #262626;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        /* Card Styling */
        .card {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }

        /* Form Inputs & Buttons */
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            background: #fafafa;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #1877f2;
        }

        .error-msg {
            color: #ed4956;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
        }

        /* Feed Post Styling */
        .post {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .post-header {
            padding: 12px;
            font-weight: bold;
        }

        .post-img {
            width: 100%;
            display: block;
            max-height: 400px;
            object-fit: cover;
        }

        .post-body {
            padding: 12px;
        }

        .post-caption {
            margin-bottom: 10px;
        }

        .like-btn {
            background: none;
            border: none;
            color: #ed4956;
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            width: auto;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- LOGIN VIEW -->
    <div id="loginView" class="card">
        <h2>Instagram</h2>
        <div id="errorMsg" class="error-msg"></div>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email (e.g., arockia@example.com)" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
    </div>

    <!-- FEED VIEW -->
    <div id="feedView" class="hidden">
        <div class="card" style="padding: 15px; text-align: center;">
            Logged in as: <strong id="userDisplay"></strong>
        </div>

        <div id="postsContainer"></div>
    </div>

</div>

<script>
    const API_BASE = "http://localhost:8080/api";
    let currentUser = null;

    // Handle Login
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const errorMsg = document.getElementById("errorMsg");

        try {
            const res = await fetch(`${API_BASE}/users/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();
            if (data.id) {
                currentUser = data;
                document.getElementById("loginView").classList.add("hidden");
                document.getElementById("feedView").classList.remove("hidden");
                document.getElementById("userDisplay").innerText = `@${currentUser.username}`;
                loadPosts();
            } else {
                errorMsg.innerText = "Invalid credentials";
            }
        } catch (err) {
            errorMsg.innerText = "Error connecting to Spring Boot server";
        }
    });

    // Fetch Posts Feed
    async function loadPosts() {
        try {
            const res = await fetch(`${API_BASE}/posts`);
            const posts = await res.json();
            const container = document.getElementById("postsContainer");
            container.innerHTML = "";

            posts.forEach(post => {
                const postElement = document.createElement("div");
                postElement.className = "post";
                postElement.innerHTML = `
            <div class="post-header">@${post.user ? post.user.username : 'user'}</div>
            ${post.imageUrl ? `<img src="${post.imageUrl}" class="post-img" alt="Post">` : ''}
            <div class="post-body">
              <div class="post-caption">${post.caption}</div>
              <button class="like-btn" onclick="toggleLike(${post.id})">❤️ Like / Unlike</button>
            </div>
          `;
                container.appendChild(postElement);
            });
        } catch (err) {
            console.error("Failed to load posts", err);
        }
    }

    // Toggle Like
    async function toggleLike(postId) {
        if (!currentUser) return;
        await fetch(`${API_BASE}/likes/toggle`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                user: { id: currentUser.id },
                post: { id: postId }
            })
        });
        alert("Like updated!");
    }
</script>
</body>
</html>
