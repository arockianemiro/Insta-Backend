<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Mini App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            color: #262626;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            background: #fafafa;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #1877f2;
        }

        .switch-card {
            text-align: center;
            font-size: 14px;
        }

        .switch-card a {
            color: #0095f6;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-logout {
            background-color: #ed4956;
            padding: 6px 12px;
            font-size: 13px;
            width: auto;
        }

        .btn-logout:hover {
            background-color: #c0392b;
        }

        .btn-delete {
            background-color: transparent;
            color: #ed4956;
            border: none;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            padding: 0;
            width: auto;
        }

        .btn-delete:hover {
            text-decoration: underline;
            background: none;
        }

        .error-msg {
            color: #ed4956;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
        }

        .success-msg {
            color: #2ecc71;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
        }

        .post {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 15px;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .post-url-box {
            width: 100%;
            padding: 8px;
            border: 1px solid #e6e6e6;
            border-radius: 4px;
            background-color: #f8f9fa;
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .post-caption {
            margin-bottom: 12px;
            font-size: 15px;
        }

        .like-btn {
            background: none;
            border: none;
            color: #ed4956;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            padding: 0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            width: auto;
        }

        .like-heart {
            display: inline-block;
            transition: transform 0.2s ease-in-out;
        }

        .like-btn:active .like-heart {
            transform: scale(1.4);
        }

        /* Comment Section Styles */
        .comments-section {
            margin-top: 12px;
            border-top: 1px solid #efefef;
            padding-top: 10px;
        }

        .comment-list {
            font-size: 13px;
            margin-bottom: 8px;
        }

        .comment-item {
            margin-bottom: 4px;
        }

        .comment-item strong {
            color: #262626;
        }

        .comment-input-container {
            display: flex;
            gap: 5px;
        }

        .comment-input-container input {
            margin-bottom: 0;
            font-size: 13px;
        }

        .comment-input-container button {
            width: auto;
            padding: 6px 12px;
            font-size: 12px;
        }

        /* Toast Notification */
        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #333;
            color: #fff;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
            z-index: 1000;
        }

        #toast.show {
            opacity: 1;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- LOGIN VIEW -->
    <div id="loginView">
        <div class="card">
            <h2>Instagram</h2>
            <div id="errorMsg" class="error-msg"></div>
            <form id="loginForm">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Log In</button>
            </form>
        </div>
        <div class="card switch-card">
            Don't have an account? <a onclick="showRegister()">Sign up</a>
        </div>
    </div>

    <!-- REGISTER VIEW -->
    <div id="registerView" class="hidden">
        <div class="card">
            <h2>Instagram</h2>
            <div id="regMsg" class="error-msg"></div>
            <form id="registerForm">
                <input type="text" id="regUsername" placeholder="Username" required>
                <input type="email" id="regEmail" placeholder="Email" required>
                <input type="password" id="regPassword" placeholder="Password" required>
                <button type="submit">Sign Up</button>
            </form>
        </div>
        <div class="card switch-card">
            Have an account? <a onclick="showLogin()">Log in</a>
        </div>
    </div>

    <!-- FEED VIEW -->
    <div id="feedView" class="hidden">
        <!-- Header -->
        <div class="card header-bar">
            <span>Logged in as: <strong id="userDisplay"></strong></span>
            <button class="btn-logout" onclick="logout()">Log Out</button>
        </div>

        <!-- Create Post Form -->
        <div class="card">
            <h3 style="margin-bottom: 10px; font-size: 16px;">Create a Post</h3>
            <textarea id="postCaption" placeholder="What's on your mind?"></textarea>
            <input type="text" id="postImageUrl" placeholder="Image URL (optional)">
            <button onclick="createPost()">Post</button>
        </div>

        <!-- Feed -->
        <div id="postsContainer"></div>
    </div>

</div>

<!-- Toast Notification element -->
<div id="toast">❤️ Post Liked!</div>

<script>
    const API_BASE = "http://localhost:8080/api";
    let currentUser = null;

    // View Navigation
    function showRegister() {
        document.getElementById("loginView").classList.add("hidden");
        document.getElementById("registerView").classList.remove("hidden");
        document.getElementById("regMsg").innerText = "";
    }

    function showLogin() {
        document.getElementById("registerView").classList.add("hidden");
        document.getElementById("loginView").classList.remove("hidden");
        document.getElementById("errorMsg").innerText = "";
    }

    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.innerText = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2000);
    }

    // Register Handler
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("regUsername").value;
        const email = document.getElementById("regEmail").value;
        const password = document.getElementById("regPassword").value;
        const regMsg = document.getElementById("regMsg");
        regMsg.className = "error-msg";
        regMsg.innerText = "";

        try {
            const res = await fetch(`${API_BASE}/users`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, email, password })
            });

            if (res.ok) {
                regMsg.className = "success-msg";
                regMsg.innerText = "Account created! Redirecting to login...";
                setTimeout(() => {
                    showLogin();
                    document.getElementById("email").value = email;
                }, 1500);
            } else {
                regMsg.innerText = "Failed to create account. Try again.";
            }
        } catch (err) {
            regMsg.innerText = "Error connecting to server";
        }
    });

    // Login Handler
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const errorMsg = document.getElementById("errorMsg");
        errorMsg.innerText = "";

        try {
            const res = await fetch(`${API_BASE}/users/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            if (res.ok) {
                const data = await res.json();
                currentUser = data;
                document.getElementById("loginView").classList.add("hidden");
                document.getElementById("feedView").classList.remove("hidden");
                document.getElementById("userDisplay").innerText = `@${currentUser.username}`;
                loadPosts();
            } else {
                const errData = await res.json();
                errorMsg.innerText = errData.error || "Invalid credentials";
            }
        } catch (err) {
            errorMsg.innerText = "Error connecting to server";
        }
    });

    // Logout Handler
    function logout() {
        currentUser = null;
        document.getElementById("loginView").classList.remove("hidden");
        document.getElementById("feedView").classList.add("hidden");
        document.getElementById("email").value = "";
        document.getElementById("password").value = "";
    }

    // Create New Post
    async function createPost() {
        const caption = document.getElementById("postCaption").value;
        const imageUrl = document.getElementById("postImageUrl").value;

        if (!caption && !imageUrl) {
            alert("Please enter a caption or image URL!");
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/posts`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    caption: caption,
                    imageUrl: imageUrl,
                    user: { id: currentUser.id }
                })
            });

            if (res.ok) {
                document.getElementById("postCaption").value = "";
                document.getElementById("postImageUrl").value = "";
                loadPosts();
                showToast("Post created successfully!");
            }
        } catch (err) {
            console.error("Failed to create post", err);
        }
    }

    // Delete Post
    async function deletePost(postId) {
        if (!confirm("Are you sure you want to delete this post?")) return;

        try {
            const res = await fetch(`${API_BASE}/posts/${postId}`, {
                method: "DELETE"
            });

            if (res.ok) {
                loadPosts();
                showToast("Post deleted!");
            }
        } catch (err) {
            console.error("Failed to delete post", err);
        }
    }

    // Load Feed Posts
    async function loadPosts() {
        try {
            const res = await fetch(`${API_BASE}/posts`);
            const posts = await res.json();
            const container = document.getElementById("postsContainer");
            container.innerHTML = "";

            posts.forEach(post => {
                const postElement = document.createElement("div");
                postElement.className = "post";

                const postUsername = post.user ? post.user.username : 'user';
                const isOwner = currentUser && post.user && currentUser.id === post.user.id;
                const deleteBtn = isOwner
                    ? `<button class="btn-delete" onclick="deletePost(${post.id})">Delete</button>`
                    : '';

                const imageUrlBox = post.imageUrl
                    ? `<div class="post-url-box"><strong>Image URL:</strong> ${post.imageUrl}</div>`
                    : '';

                postElement.innerHTML = `
            <div class="post-header">
              <span>@${postUsername}</span>
              ${deleteBtn}
            </div>
            ${imageUrlBox}
            <div class="post-caption">${post.caption || ''}</div>
            <button class="like-btn" onclick="toggleLike(${post.id}, this)">
              <span class="like-heart">❤️</span> Like
            </button>
            <div class="comments-section">
              <div class="comment-input-container">
                <input type="text" id="comment-input-${post.id}" placeholder="Add a comment...">
                <button onclick="addComment(${post.id})">Post</button>
              </div>
            </div>
          `;
                container.appendChild(postElement);
            });
        } catch (err) {
            console.error("Failed to load posts", err);
        }
    }

    // Add Comment
    async function addComment(postId) {
        const input = document.getElementById(`comment-input-${postId}`);
        const text = input.value.trim();
        if (!text || !currentUser) return;

        try {
            const res = await fetch(`${API_BASE}/comments`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    text: text,
                    user: { id: currentUser.id },
                    post: { id: postId }
                })
            });

            if (res.ok) {
                input.value = "";
                showToast("Comment added!");
            }
        } catch (err) {
            console.error("Failed to add comment", err);
        }
    }

    // Like Toggle
    async function toggleLike(postId, btnElement) {
        if (!currentUser) return;

        const heart = btnElement.querySelector('.like-heart');
        heart.style.transform = 'scale(1.5)';
        setTimeout(() => heart.style.transform = 'scale(1)', 200);

        try {
            await fetch(`${API_BASE}/likes/toggle`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    user: { id: currentUser.id },
                    post: { id: postId }
                })
            });
            showToast("❤️ Post Liked!");
        } catch (err) {
            console.error("Failed to toggle like", err);
        }
    }
</script>
</body>
</html>
